<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Open a chta invitation</title>
  <link rel="icon" href="/brand.png">
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/share/share.css">
  <script type="module" src="/share/share.js"></script>
</head>
<body>
  <main class="share-page wrap">
    <a class="brand" href="/"><img src="/brand.png" alt="" width="40" height="40"><span>chta</span></a>
    <h1>Open invitation</h1>
    <p id="status" role="status">Open chta to review this invitation.</p>
    <div class="share-actions">
      <a id="open-app" class="share-primary" hidden>Open in chta</a>
      <a id="open-web" class="share-primary" hidden>Continue on web</a>
      <button type="button" id="copy" hidden>Copy invitation</button>
      <a id="download" href="/#platforms">Get chta</a>
    </div>
    <noscript><p>Enable JavaScript to open the invitation.</p></noscript>
  </main>
</body>
</html>

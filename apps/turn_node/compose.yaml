services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TURN_HOST: ${TURN_HOST:?Set TURN_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
  issuer:
    image: node:22-alpine
    restart: unless-stopped
    user: node
    command: ["node", "/app/issuer.mjs"]
    environment:
      TURN_HOST: ${TURN_HOST:?Set TURN_HOST}
      TURN_ACCESS_TOKEN: ${TURN_ACCESS_TOKEN:?Set TURN_ACCESS_TOKEN}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET}
    volumes:
      - ./issuer.mjs:/app/issuer.mjs:ro
  turn:
    image: coturn/coturn:4.19.2-r0
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET}
    tmpfs:
      - /tmp:mode=1777
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf 'static-auth-secret=%s\n' "$${TURN_SHARED_SECRET}" > /tmp/chta-turn.conf
        unset TURN_SHARED_SECRET
        exec turnserver -c /tmp/chta-turn.conf \
          --fingerprint \
          --use-auth-secret \
          --realm=${TURN_HOST:?Set TURN_HOST} \
          --listening-ip=${TURN_LISTEN_IP:?Set TURN_LISTEN_IP} \
          --relay-ip=${TURN_LISTEN_IP:?Set TURN_LISTEN_IP} \
          --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP}/${TURN_LISTEN_IP:?Set TURN_LISTEN_IP} \
          --listening-port=3478 \
          --min-port=49160 \
          --max-port=49200 \
          --no-cli \
          --no-tls \
          --no-dtls \
          --no-tcp-relay \
          --no-multicast-peers \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --user-quota=20 \
          --total-quota=40 \
          --max-bps=1000000 \
          --bps-capacity=8000000 \
          --log-file=stdout
volumes:
  caddy_data:

[package]
name = "cht-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
bip39 = { version = "3.0.0", features = ["zeroize"] }
ed25519-dalek = "3.0.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
hkdf = "0.12.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.8.2"
cht-relay-protocol = { path = "../relay_protocol" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = "0.5.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"

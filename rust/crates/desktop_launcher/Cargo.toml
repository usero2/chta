[package]
name = "chta-launcher"
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
